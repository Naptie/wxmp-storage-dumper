name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag (must match the VERSION file)
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          ver="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME#v}" != "$ver" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION file ($ver)" >&2
            exit 1
          fi

      - name: Build hook DLL and bridge
        shell: cmd
        run: build-all.cmd %VERSION%

      - name: Smoke test
        shell: cmd
        run: bridge\bin\Release\wxmp-storage-dumper.exe --selftest

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp bridge/bin/Release/wxmp-storage-dumper.exe dist/
          cp "native/wmpf-hook/wmpf-hook-${VERSION}.dll" dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
